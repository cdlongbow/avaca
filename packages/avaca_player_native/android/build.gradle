group 'com.avaca.player.avaca'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def avacaMsquicRoot = project.findProperty('avaca.msquic.root')?.toString()
if (avacaMsquicRoot == null || avacaMsquicRoot.trim().isEmpty()) {
    avacaMsquicRoot = System.getenv('AVACA_MSQUIC_ROOT') ?: ''
}
def avacaAndroidArm64Only = (System.getenv('AVACA_ANDROID_ARM64_ONLY') ?: '')
        .equalsIgnoreCase('true')

android {
    namespace 'com.avaca.player.avaca'
    compileSdk 36
    ndkVersion '28.2.13676358'

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        minSdk 23
        ndk {
            if (avacaAndroidArm64Only) {
                abiFilters 'arm64-v8a'
            } else {
                // Keep x86_64 for local emulator/debug verification; the
                // signed release job explicitly enables arm64-only packaging.
                abiFilters 'arm64-v8a', 'x86_64'
            }
        }
        externalNativeBuild {
            cmake {
                arguments "-DAVACA_MSQUIC_ROOT=${avacaMsquicRoot}"
            }
        }
    }
}

dependencies {
    implementation 'androidx.media3:media3-datasource:1.10.1'
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    implementation 'androidx.media3:media3-ui:1.10.1'
}
