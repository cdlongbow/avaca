name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Validate tag and pubspec version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="$(printenv GITHUB_REF_NAME)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vX.Y.Z; received: $tag" >&2
            exit 1
          fi

          version="$(printf '%s' "$tag" | sed 's/^v//')"
          app_version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1)"
          if [[ -z "$app_version" || "$app_version" != "$version" ]]; then
            echo "Tag $tag does not match pubspec.yaml base version $app_version" >&2
            exit 1
          fi

          if [[ "$version" == '0.8.0' ]]; then
            version_code=30
          else
            version_code=$((GITHUB_RUN_NUMBER + 2020))
          fi
          if (( version_code < 30 )); then
            echo "Android versionCode is invalid: $version_code." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

  android:
    name: Android ARMv8-A APK
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Provision pinned MsQuic source for Android
        shell: bash
        run: |
          set -euo pipefail

          lock='tooling/msquic/msquic-v2.6.0.lock.json'
          repository="$(jq -r '.repository' "$lock")"
          tag="$(jq -r '.tag' "$lock")"
          commit="$(jq -r '.commit' "$lock")"
          root="$RUNNER_TEMP/msquic-$commit"

          rm -rf "$root"
          git clone --recurse-submodules --branch "$tag" --depth 1 "$repository" "$root"
          git -C "$root" checkout --detach "$commit"
          git -C "$root" submodule update --init --recursive

          actual="$(git -C "$root" rev-parse HEAD)"
          tagged="$(git -C "$root" rev-list -n 1 "$tag")"
          if [[ "$actual" != "$commit" || "$tagged" != "$commit" ]]; then
            echo "Pinned MsQuic checkout mismatch: expected=$commit actual=$actual tag=$tagged" >&2
            exit 1
          fi
          if [[ ! -f "$root/src/inc/msquic.h" ]]; then
            echo "Pinned MsQuic source checkout is incomplete: $root/src/inc/msquic.h" >&2
            exit 1
          fi

          echo "AVACA_MSQUIC_ROOT=$root" >> "$GITHUB_ENV"

      - name: Configure Android NDK toolchain environment
        shell: bash
        run: |
          set -euo pipefail

          ndk_root="${ANDROID_NDK_ROOT:-${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-}}}"
          if [[ -z "$ndk_root" ]]; then
            sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            if [[ -z "$sdk_root" || ! -d "$sdk_root/ndk" ]]; then
              echo "Unable to locate the Android SDK NDK directory." >&2
              exit 1
            fi
            ndk_root="$(find "$sdk_root/ndk" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          fi

          ndk_bin="$ndk_root/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [[ ! -x "$ndk_bin/clang" || ! -x "$ndk_bin/aarch64-linux-android29-clang" ]]; then
            echo "Android NDK LLVM toolchain is incomplete: $ndk_bin" >&2
            exit 1
          fi

          echo "ANDROID_NDK_ROOT=$ndk_root" >> "$GITHUB_ENV"
          echo "$ndk_bin" >> "$GITHUB_PATH"

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            value="$(printenv "$secret_name" || true)"
            if [[ -z "$value" ]]; then
              echo "Missing required GitHub Actions secret: $secret_name" >&2
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/avaca-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=avaca-release.jks
          EOF

      - name: Use runner Java for Gradle
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/^[[:space:]]*org\.gradle\.java\.home[[:space:]]*=/d' android/gradle.properties

      - name: Build ARMv8-A APK
        run: >
          flutter build apk
          --release
          --target-platform android-arm64
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.version_code }}"

      - name: Verify Android version metadata
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ needs.metadata.outputs.version_code }}
        run: |
          set -euo pipefail

          apk="build/app/outputs/flutter-apk/app-release.apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          if [[ -z "$aapt" || ! -x "$aapt" ]]; then
            echo "Unable to locate Android aapt for version verification." >&2
            exit 1
          fi

          package_line="$("$aapt" dump badging "$apk" | grep -m 1 '^package:')"
          grep -F "versionCode='$EXPECTED_VERSION_CODE'" <<< "$package_line"
          grep -F "versionName='$EXPECTED_VERSION'" <<< "$package_line"

      - name: Name and hash APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          artifact="avaca-${{ needs.metadata.outputs.version }}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$artifact"
          (
            cd dist
            sha256sum "$artifact" > "$artifact.sha256"
          )

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x64 portable bundle
    needs: metadata
    runs-on: windows-2022
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch pinned Windows player dependencies
        shell: pwsh
        run: >
          pwsh -NoProfile -ExecutionPolicy Bypass -File
          "${{ github.workspace }}\scripts\fetch_windows_player_dependencies.ps1"
          -DependencyRoot "${{ github.workspace }}\windows\engine"

      - name: Verify Windows native toolchain
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $requiredComponent = 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "Visual Studio Locator is missing: $vswhere"
          }

          $installationPath = [string](& $vswhere -latest -products '*' -requires $requiredComponent -property installationPath | Select-Object -First 1)
          if ([string]::IsNullOrWhiteSpace($installationPath)) {
            throw "Visual Studio with MSVC x64 tools was not found."
          }

          $installationVersion = [string](& $vswhere -latest -products '*' -requires $requiredComponent -property installationVersion | Select-Object -First 1)
          $vcvars = Join-Path $installationPath 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path -LiteralPath $vcvars -PathType Leaf)) {
            throw "The x64 MSVC environment script is missing: $vcvars"
          }

          Write-Host "Using Visual Studio $($installationVersion.Trim()) at $($installationPath.Trim())"

      - name: Build Windows release bundle
        run: >
          flutter build windows
          --release
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ needs.metadata.outputs.version_code }}"

      - name: Verify pinned Flutter engine in Windows bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $repoRoot = $env:GITHUB_WORKSPACE
          $pinned = Join-Path $repoRoot 'windows/engine/flutter_windows.dll'
          $releaseDir = Join-Path $repoRoot 'build/windows/x64/runner/Release'
          $bundled = Join-Path $releaseDir 'flutter_windows.dll'
          $pinnedImport = Join-Path $repoRoot 'windows/engine/flutter_windows.dll.lib'
          $ephemeralImport = Join-Path $repoRoot 'windows/flutter/ephemeral/flutter_windows.dll.lib'

          foreach ($path in @($pinned, $pinnedImport, $bundled, $ephemeralImport)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Pinned Flutter engine artifact is missing: $path"
            }
          }

          $pinnedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $pinned).Hash
          $bundledHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundled).Hash
          if ($pinnedHash -ne $bundledHash) {
            throw "Windows bundle Flutter engine hash mismatch: pinned=$pinnedHash bundled=$bundledHash"
          }

          $pinnedImportHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $pinnedImport).Hash
          $ephemeralImportHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $ephemeralImport).Hash
          if ($pinnedImportHash -ne $ephemeralImportHash) {
            throw "Windows bundle Flutter import library hash mismatch: pinned=$pinnedImportHash ephemeral=$ephemeralImportHash"
          }

          $expectedPlayerHashes = @{
            'libmpv-2.dll' = '63FED593A9E1B3C7E170BB38FCDF73722FA3D73B7C068F303BF2985EEEC75367'
            'libEGL.dll' = '3562C97F80C4EE79E9CD19881981A6C4BD69E26D04A9B0D88B54DDBFA334F58B'
            'libGLESv2.dll' = '2B43130299CAD2156D20BBE5C2DBA3E6FF079A4F38E96D834FCDFDD3D68F4332'
            'd3dcompiler_47.dll' = 'E407B9FFADEF47E87994DC488214F75405CF04EE99589F2315FC7AB99FD1DFE2'
            'vk_swiftshader.dll' = '329912B23F6DD001981E3C18CF0F99B7E41F99F8B36EEAF629B1E3D298DFBF10'
            'vulkan-1.dll' = '14323F145642B0C16DD2354A1158D823DE9EF5CB14FBB75AA3971A6E5FD42A0F'
          }
          foreach ($entry in $expectedPlayerHashes.GetEnumerator()) {
            $runtimePath = Join-Path $releaseDir $entry.Key
            if (-not (Test-Path -LiteralPath $runtimePath -PathType Leaf)) {
              throw "Windows release bundle is missing player runtime: $runtimePath"
            }
            $runtimeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $runtimePath).Hash.ToUpperInvariant()
            if ($runtimeHash -ne $entry.Value) {
              throw "Windows player runtime hash mismatch for $($entry.Key): expected=$($entry.Value) actual=$runtimeHash"
            }
            Write-Host "$($entry.Key) SHA-256: $runtimeHash"
          }

          foreach ($requiredPath in @(
            (Join-Path $releaseDir 'avaca.exe'),
            (Join-Path $releaseDir 'avaca_update.exe'),
            (Join-Path $releaseDir 'data/flutter_assets'),
            $bundled
          )) {
            if (-not (Test-Path -LiteralPath $requiredPath)) {
              throw "Windows release bundle is incomplete: $requiredPath"
            }
          }

          Write-Host "Pinned Flutter engine SHA-256: $pinnedHash"

      - name: Package versioned portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = '${{ needs.metadata.outputs.version }}'
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release'
          $packageRoot = Join-Path $env:RUNNER_TEMP "avaca-$version-windows-x64-portable"
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $zipName = "avaca-$version.zip"
          $zipPath = Join-Path $dist $zipName

          foreach ($requiredFile in @(
            'avaca.exe',
            'avaca_update.exe',
            'libmpv-2.dll',
            'libEGL.dll',
            'libGLESv2.dll',
            'd3dcompiler_47.dll',
            'vk_swiftshader.dll',
            'vulkan-1.dll'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $releaseDir $requiredFile) -PathType Leaf)) {
              throw "Windows release bundle is missing ${requiredFile}: $releaseDir"
            }
          }

          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageRoot, $dist | Out-Null
          Copy-Item -Path (Join-Path $releaseDir '*') -Destination $packageRoot -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'README.md') -Destination (Join-Path $packageRoot 'README.md') -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'THIRD_PARTY_NOTICES.md') -Destination (Join-Path $packageRoot 'THIRD_PARTY_NOTICES.md') -Force
          $licenseRoot = Join-Path $packageRoot 'licenses/avaca_player_native/windows'
          New-Item -ItemType Directory -Force -Path $licenseRoot | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'packages/avaca_player_native/windows/THIRD_PARTY_PROVENANCE.md') -Destination $licenseRoot -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'packages/avaca_player_native/windows/THIRD_PARTY_LICENSES.md') -Destination $licenseRoot -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'packages/avaca_player_native/windows/WINDOWS_PLAYER_DEPS.lock.json') -Destination $licenseRoot -Force
          Set-Content -LiteralPath (Join-Path $packageRoot 'version.txt') -Value $version -NoNewline -Encoding utf8

          Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zipPath -CompressionLevel Optimal

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zipPath.sha256" -Value "$hash  $zipName" -NoNewline -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs:
      - metadata
      - android
      - windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged release notes
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-${{ needs.metadata.outputs.version }}
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-${{ needs.metadata.outputs.version }}
          path: dist

      - name: Verify versioned release assets
        shell: bash
        run: |
          set -euo pipefail

          expected_files=(
            "avaca-${{ needs.metadata.outputs.version }}-arm64-v8a.apk"
            "avaca-${{ needs.metadata.outputs.version }}-arm64-v8a.apk.sha256"
            "avaca-${{ needs.metadata.outputs.version }}.zip"
            "avaca-${{ needs.metadata.outputs.version }}.zip.sha256"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_files[@]}" | sort)
          mapfile -t actual_sorted < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)

          if [[ "${actual_sorted[*]}" != "${expected_sorted[*]}" ]]; then
            echo 'Release assets do not match the required naming contract.' >&2
            echo 'Expected:' >&2
            printf '  %s\n' "${expected_sorted[@]}" >&2
            echo 'Actual:' >&2
            printf '  %s\n' "${actual_sorted[@]}" >&2
            exit 1
          fi

          for checksum in "${expected_sorted[@]}"; do
            if [[ "$checksum" == *.sha256 ]]; then
              (cd dist && sha256sum --check --strict "$checksum")
            fi
          done

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.metadata.outputs.tag }}"
          version="${{ needs.metadata.outputs.version }}"
          notes_file="$GITHUB_WORKSPACE/docs/release-notes-$version.md"
          create_notes_args=(--generate-notes)
          if [[ -f "$notes_file" ]]; then
            create_notes_args=(--notes-file "$notes_file")
          fi

          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            if [[ -f "$notes_file" ]]; then
              gh release edit "$tag" \
                --repo "$GH_REPO" \
                --title "AVACA $version" \
                --notes-file "$notes_file"
            else
              gh release edit "$tag" \
                --repo "$GH_REPO" \
                --title "AVACA $version"
            fi
            gh release upload "$tag" \
              --repo "$GH_REPO" \
              "dist/avaca-$version-arm64-v8a.apk" \
              "dist/avaca-$version-arm64-v8a.apk.sha256" \
              "dist/avaca-$version.zip" \
              "dist/avaca-$version.zip.sha256" \
              --clobber
          else
            gh release create "$tag" \
              --repo "$GH_REPO" \
              "dist/avaca-$version-arm64-v8a.apk" \
              "dist/avaca-$version-arm64-v8a.apk.sha256" \
              "dist/avaca-$version.zip" \
              "dist/avaca-$version.zip.sha256" \
              --title "AVACA $version" \
              "${create_notes_args[@]}"
          fi
