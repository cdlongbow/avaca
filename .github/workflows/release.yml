name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Validate tag and pubspec version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="$(printenv GITHUB_REF_NAME)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vX.Y.Z; received: $tag" >&2
            exit 1
          fi

          version="$(printf '%s' "$tag" | sed 's/^v//')"
          app_version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1)"
          if [[ -z "$app_version" || "$app_version" != "$version" ]]; then
            echo "Tag $tag does not match pubspec.yaml base version $app_version" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    name: Android ARMv8-A APK
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            value="$(printenv "$secret_name" || true)"
            if [[ -z "$value" ]]; then
              echo "Missing required GitHub Actions secret: $secret_name" >&2
              exit 1
            fi
          done

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/avaca-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=avaca-release.jks
          EOF

      - name: Build ARMv8-A APK
        run: >
          flutter build apk
          --release
          --target-platform android-arm64
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ github.run_number }}"

      - name: Name and hash APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          artifact="avaca-${{ needs.metadata.outputs.version }}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$artifact"
          (
            cd dist
            sha256sum "$artifact" > "$artifact.sha256"
          )

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x64 portable bundle
    needs: metadata
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release bundle
        run: >
          flutter build windows
          --release
          --build-name "${{ needs.metadata.outputs.version }}"
          --build-number "${{ github.run_number }}"

      - name: Package versioned portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $version = '${{ needs.metadata.outputs.version }}'
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'build/windows/x64/runner/Release'
          $packageRoot = Join-Path $env:RUNNER_TEMP "avaca-$version-windows-x64-portable"
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $zipName = "avaca-$version.zip"
          $zipPath = Join-Path $dist $zipName

          if (-not (Test-Path -LiteralPath (Join-Path $releaseDir 'avaca.exe'))) {
            throw "Windows release bundle is missing avaca.exe: $releaseDir"
          }

          Remove-Item -LiteralPath $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageRoot, $dist | Out-Null
          Copy-Item -Path (Join-Path $releaseDir '*') -Destination $packageRoot -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'scripts/update-portable.ps1') -Destination (Join-Path $packageRoot 'update-portable.ps1') -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'update.cmd') -Destination (Join-Path $packageRoot 'update.cmd') -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'README.md') -Destination (Join-Path $packageRoot 'README.md') -Force
          Set-Content -LiteralPath (Join-Path $packageRoot 'version.txt') -Value $version -NoNewline -Encoding utf8

          Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath $zipPath -CompressionLevel Optimal

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zipPath.sha256" -Value "$hash  $zipName" -Encoding ascii

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ needs.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs:
      - metadata
      - android
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: android-${{ needs.metadata.outputs.version }}
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-${{ needs.metadata.outputs.version }}
          path: dist

      - name: Verify versioned release assets
        shell: bash
        run: |
          set -euo pipefail
          test -f "dist/avaca-${{ needs.metadata.outputs.version }}-arm64-v8a.apk"
          test -f "dist/avaca-${{ needs.metadata.outputs.version }}-arm64-v8a.apk.sha256"
          test -f "dist/avaca-${{ needs.metadata.outputs.version }}.zip"
          test -f "dist/avaca-${{ needs.metadata.outputs.version }}.zip.sha256"
          find dist -maxdepth 1 -type f -print

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.metadata.outputs.tag }}"
          version="${{ needs.metadata.outputs.version }}"

          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --repo "$GH_REPO" \
              --title "AVACA $version"
            gh release upload "$tag" \
              --repo "$GH_REPO" \
              "dist/avaca-$version-arm64-v8a.apk" \
              "dist/avaca-$version-arm64-v8a.apk.sha256" \
              "dist/avaca-$version.zip" \
              "dist/avaca-$version.zip.sha256" \
              --clobber
          else
            gh release create "$tag" \
              --repo "$GH_REPO" \
              "dist/avaca-$version-arm64-v8a.apk" \
              "dist/avaca-$version-arm64-v8a.apk.sha256" \
              "dist/avaca-$version.zip" \
              "dist/avaca-$version.zip.sha256" \
              --title "AVACA $version" \
              --generate-notes
          fi
